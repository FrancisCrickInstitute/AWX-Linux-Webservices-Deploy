---
# Created by Adam Spandel, October 2026
# Purpose: Applies security-hardening settings to the Apache webserver.
# Deploys the managed hardening configuration and associated security controls.

- name: Deploy Apache hardening configuration
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/httpd/conf.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - apache_reload
