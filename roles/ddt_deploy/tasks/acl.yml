---
# Created by Adam Spandel, October 2026
# Purpose: Configures filesystem ACL permissions required by the DDT deployment model.
# Grants controlled access to PHP session data, webserver logs and PHP-FPM logs.

- name: Install ACL utilities
  ansible.builtin.dnf:
    name: acl
    state: present

- name: Grant DDT access to PHP session directory
  ansible.posix.acl:
    path: "{{ ddt_deploy_php_session_dir }}"
    entity: "{{ ddt_deploy_user }}"
    etype: user
    permissions: rwX
    state: present

- name: Grant DDT group access to Apache logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_apache_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    recursive: true
    state: present
  when: ddt_deploy_web_server == "apache"

- name: Set default DDT permissions on Apache logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_apache_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    default: true
    state: present
  when: ddt_deploy_web_server == "apache"

- name: Grant DDT group access to NGINX logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_nginx_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    recursive: true
    state: present
  when: ddt_deploy_web_server == "nginx"

- name: Set default DDT permissions on NGINX logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_nginx_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    default: true
    state: present
  when: ddt_deploy_web_server == "nginx"

- name: Grant DDT group access to PHP-FPM logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_php_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    recursive: true
    state: present

- name: Set default DDT permissions on PHP-FPM logs
  ansible.posix.acl:
    path: "{{ ddt_deploy_php_log_dir }}"
    entity: "{{ ddt_deploy_group }}"
    etype: group
    permissions: rX
    default: true
    state: present
