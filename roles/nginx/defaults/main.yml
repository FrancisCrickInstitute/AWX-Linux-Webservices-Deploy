---
# =============================================================================
# NGINX role defaults
# =============================================================================
# Created by Adam Spandel, October 2026
# Default variables used by the NGINX role.
# These values can be overridden by group_vars, host_vars, playbook variables,
# or AWX extra variables where required.
# =============================================================================

# -----------------------------------------------------------------------------
# Package and service
# -----------------------------------------------------------------------------

nginx_package_name: nginx
nginx_service_name: nginx

nginx_service_enabled: true
nginx_service_state: started

# -----------------------------------------------------------------------------
# NGINX user and group
# -----------------------------------------------------------------------------

nginx_user: nginx
nginx_group: nginx

# -----------------------------------------------------------------------------
# Configuration paths
# -----------------------------------------------------------------------------

nginx_config_dir: /etc/nginx
nginx_config_file: "{{ nginx_config_dir }}/nginx.conf"
nginx_conf_d_dir: "{{ nginx_config_dir }}/conf.d"

nginx_sites_available_dir: "{{ nginx_config_dir }}/sites-available"
nginx_sites_enabled_dir: "{{ nginx_config_dir }}/sites-enabled"

# -----------------------------------------------------------------------------
# Website configuration
# -----------------------------------------------------------------------------

nginx_server_name: "{{ ansible_fqdn }}"
nginx_document_root: /home/ddt-deploy/site

nginx_http_port: 80
nginx_https_port: 443

nginx_index_files:
  - index.php
  - index.html

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

nginx_log_dir: /var/log/nginx

# -----------------------------------------------------------------------------
# Performance
# -----------------------------------------------------------------------------

nginx_worker_processes: auto
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65
